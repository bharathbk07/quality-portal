core_port = 4002
integration_port = 4003
bind_host = 0.0.0.0
gateway_port = 8088
frontend_dev_port = 5173
frontend_dev_host = 127.0.0.1

[security]
public_origins = http://localhost:8088,http://127.0.0.1:8088,http://127.0.0.1:5173
cookie_secure = false
session_ttl_seconds = 28800
rate_limit_max = 100
rate_limit_window_ms = 60000
login_rate_limit_max = 5
body_limit_bytes = 8000000

[timeouts]
langsmith_ms = 3000
service_ms = 50000
ai_ms = 45000
telemetry_ms = 10000

[storage]
connection_timeout_ms = 5000
idle_timeout_ms = 30000
statement_timeout_ms = 30000
pool_max = 10
