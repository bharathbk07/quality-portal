; Non-secret operational configuration. Environment variables override matching keys.
; Never put credentials here. Values in [public] are visible to browsers.
[services]
settings_service_url = http://core:4002
ai_service_url = http://ai:4004
ai_port = 4004
bff_url = http://127.0.0.1:8088
core_url = http://core:4002
integration_url = http://integration:4003
