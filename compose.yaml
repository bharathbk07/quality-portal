name: vivegam-quality-lab
x-service: &service
  build: {context: ., target: service}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  volumes: [./configuration.ini:/app/configuration.ini:ro]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  gateway:
    image: traefik:v3.6
    command: [--entrypoints.web.address=:8080, --providers.file.filename=/etc/traefik/routes.yml, --accesslog=true, --log.level=INFO]
    ports: ["127.0.0.1:${GATEWAY_PORT:?Set GATEWAY_PORT in .env}:8080"]
    volumes: [./infrastructure/gateway/routes.yml:/etc/traefik/routes.yml:ro]
    networks: [edge]
    depends_on: [frontend, bff]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  frontend:
    build: {context: ., target: frontend}
    volumes: [./configuration.ini:/app/configuration.ini:ro]
    environment: {BFF_URL: "http://bff:4001", HOSTNAME: "0.0.0.0", PORT: "3000"}
    networks: [edge]
    restart: unless-stopped
    cap_drop: [ALL]
  bff:
    <<: *service
    command: [node, services/bff/index.mjs]
    environment:
      PORT: 4001
      CORE_URL: http://core:4002
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Run npm run setup:local}
      SESSION_SECRET: ${SESSION_SECRET:?Run npm run setup:local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run npm run setup:local}
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:?Set PUBLIC_ORIGINS in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks: [edge, backend]
    depends_on: {core: {condition: service_healthy}}
  core:
    <<: *service
    command: [node, services/core/index.mjs]
    environment:
      PORT: 4002
      INTEGRATION_URL: http://integration:4003
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      DATABASE_URL: postgres://vivegam:${POSTGRES_PASSWORD}@postgres:5432/vivegam
      REDIS_URL: redis://redis:6379
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Run npm run setup:local}
    networks: [backend, data]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, integration: {condition: service_started}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4002/health/ready',{headers:{'x-service-token':process.env.SERVICE_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  integration:
    <<: *service
    command: [node, services/integration/index.mjs]
    environment:
      PORT: 4003
      SERVICE_TOKEN: ${SERVICE_TOKEN}
    tmpfs: ["/tmp:size=${REPOSITORY_TMPFS_SIZE:-128m}"]
    networks: [backend, egress]
  ai:
    build: {context: ., dockerfile: services/ai/Dockerfile}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    volumes: [./configuration.ini:/app/configuration.ini:ro]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, egress]
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN}
  map-worker:
    <<: *service
    command: [node, services/mapping/index.mjs]
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      DATABASE_URL: postgres://vivegam:${POSTGRES_PASSWORD}@postgres:5432/vivegam
      INTEGRATION_URL: http://integration:4003
    networks: [backend, data]
    depends_on: {postgres: {condition: service_healthy}, integration: {condition: service_started}}
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: vivegam, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Run npm run setup:local}", POSTGRES_DB: vivegam}
    volumes: [postgres-data:/var/lib/postgresql/data, ./infrastructure/postgres/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro]
    networks: [data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U vivegam"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    networks: [data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10}
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro, prometheus-data:/prometheus]
    networks: [backend]
volumes:
  postgres-data:
  redis-data:
  prometheus-data:
networks:
  edge:
  backend: {internal: true}
  data: {internal: true}
  egress:
